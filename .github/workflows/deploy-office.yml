name: 部署監控後台 / Deploy monitor

on:
  push:
    branches: [main]
    paths:
      - "office/**"
      - ".github/workflows/deploy-office.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: 沒有設定 Cloudflare 金鑰就略過
        if: env.HAS_TOKEN != 'true'
        run: echo "這個專案沒有設定 CLOUDFLARE_API_TOKEN，略過部署。" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - name: 部署到 Cloudflare Workers
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: office
          wranglerVersion: "4.156.2"
          secrets: |
            INGEST_TOKEN
            VIEW_TOKEN
        env:
          INGEST_TOKEN: ${{ secrets.OFFICE_INGEST_TOKEN }}
          VIEW_TOKEN: ${{ secrets.OFFICE_VIEW_TOKEN }}
