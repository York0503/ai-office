<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17212a">
<title>AI 辦公室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root {
  /* 夜晚的像素辦公大樓：深石板藍底、檯燈琥珀色是老闆室，每個部門一個代表色 */
  --bg: #17212a;
  --panel: #1f2c37;
  --panel-2: #263644;
  --line: #34495a;
  --ink: #e9efe6;
  --muted: #9db0b8;
  --accent: #ffb347;
  --ok: #7bd389;
  --bad: #ff6b5b;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-pixel: "Silkscreen", ui-monospace, monospace;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--panel) 1px, transparent 1px), linear-gradient(90deg, var(--panel) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font: 15px/1.6 var(--font-body);
}
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header.top { position: sticky; top: 0; z-index: 5; background: rgba(23,33,42,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: grid; gap: 8px; }
.row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-pixel); color: var(--accent); font-size: 15px; letter-spacing: .06em; white-space: nowrap; }
.live { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.live.on i { background: var(--ok); box-shadow: 0 0 0 0 rgba(123,211,137,.6); animation: ping 1.6s infinite; }
@keyframes ping { 70% { box-shadow: 0 0 0 8px rgba(123,211,137,0); } 100% { box-shadow: 0 0 0 0 rgba(123,211,137,0); } }
select, input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); padding: 6px 8px; font: 14px var(--font-body); min-width: 0; }
#sessionSel { flex: 1 1 220px; max-width: 520px; width: 100%; }
#roundSel { width: 100%; max-width: 360px; }
body { overflow-x: hidden; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; font-size: 13px; color: var(--muted); }
.stat b { color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 4px; }
.stat.bad b { color: var(--bad); }
.tabs { display: flex; gap: 4px; }
.tabs button { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px 14px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.view[hidden] { display: none !important; }
.notice { background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; color: var(--muted); font-size: 14px; }
.notice b { color: var(--ink); }

/* round header */
.roundbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.prompt { flex: 1 1 280px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; }
.prompt small { color: var(--muted); display: block; font-size: 12px; }
.prompt p { margin: 2px 0 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }

/* rooms */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-items: start; }
.room { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 8px; padding: 10px 12px 12px; display: grid; gap: 8px; }
.room.exec { grid-column: 1 / -1; }
.room-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.room-head h2 { margin: 0; font-size: 16px; font-weight: 900; color: var(--c); }
.room-head span { font-size: 12px; color: var(--muted); }
.team-label { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.tile {
  position: relative; width: 92px; display: grid; justify-items: center; gap: 2px; text-align: center;
  background: var(--panel-2); border: 2px solid transparent; border-radius: 8px; padding: 6px 4px 6px; cursor: pointer;
}
.tile .nm { font-size: 12px; font-weight: 700; line-height: 1.3; }
.tile .act { font-size: 11px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 0; word-break: break-all; }
.tile.idle { opacity: .42; }
.tile.idle .act { display: none; }
.tile.working { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.tile.working svg { animation: bob .7s steps(2) infinite; }
.tile.done { border-color: color-mix(in srgb, var(--ok) 60%, transparent); }
.tile.error { border-color: var(--bad); }
@keyframes bob { 50% { transform: translateY(-2px); } }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; font: 700 11px/20px var(--font-body); text-align: center; color: var(--bg); background: var(--ok); }
.badge.err { background: var(--bad); color: #fff; }
.badge.n { background: var(--accent); }
.badge.wait { background: #ffd166; }
svg.sprite { image-rendering: pixelated; display: block; }

/* tree */
.tree { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; }
.tree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px dashed var(--line); }
.tree > ul { border-left: 0; padding-left: 0; }
.tree li { margin: 6px 0; }
.node { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; padding: 4px 10px 4px 6px; cursor: pointer; text-align: left; max-width: 100%; }
.node .t { display: grid; }
.node .t b { font-size: 13px; }
.node .t span { font-size: 12px; color: var(--muted); }
.st { font-size: 11px; border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.st.working { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--accent); }
.st.done { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
.st.error { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
.st.waiting { background: rgba(255,209,102,.2); color: #ffd166; }

/* log */
.logtools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#logSearch { flex: 1 1 180px; }
.log { display: grid; gap: 4px; }
.ev { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; }
.ev summary { list-style: none; display: grid; grid-template-columns: 62px 26px 1fr; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; }
.ev summary::-webkit-details-marker { display: none; }
.ev time { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .what { font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.ev .what b { color: var(--c); font-weight: 700; margin-right: 6px; }
.ev.err { border-left-color: var(--bad); background: rgba(255,107,91,.12); }
.ev pre, .sheet pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); font: 12px/1.55 var(--font-mono); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; color: var(--ink); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
.sheet { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 82vh; overflow: auto; background: var(--panel); border-top: 4px solid var(--c); border-radius: 14px 14px 0 0; padding: 14px 16px 24px; display: grid; gap: 10px; align-content: start; }
@media (min-width: 900px) { .sheet { left: auto; top: 0; width: 460px; max-height: none; border-radius: 0; border-top: 0; border-left: 4px solid var(--c); } }
.sheet-head { display: flex; gap: 12px; align-items: center; }
.sheet-head h3 { margin: 0; font-size: 20px; color: var(--c); }
.sheet-head small { color: var(--muted); display: block; }
.sheet .close { margin-left: auto; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.box h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.box p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.inst { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 6px; }
.timeline { display: grid; gap: 3px; font-size: 12px; }
.timeline div { display: grid; grid-template-columns: 62px 1fr; gap: 6px; }
.timeline time { font-family: var(--font-mono); color: var(--muted); }
.timeline .th { color: #c9b8ff; font-style: italic; }
.timeline .er { color: var(--bad); }

@media (max-width: 520px) {
  #sessionSel { order: 3; flex-basis: 100%; max-width: none; }
  .live { margin-left: auto; }
  .tile { width: calc((100% - 18px) / 4); min-width: 74px; }
  .rooms { grid-template-columns: 1fr; }
  .ev summary { grid-template-columns: 54px 22px 1fr; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .tile.working svg, .live.on i { animation: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="row1">
      <span class="brand">AI OFFICE</span>
      <select id="sessionSel" aria-label="選擇對話"></select>
      <span class="live" id="live"><i></i><span id="liveTxt">連線中</span></span>
    </div>
    <div class="row1">
      <div class="stats" id="stats"></div>
      <div class="tabs" role="tablist" style="margin-left:auto">
        <button role="tab" id="tab-office" aria-selected="true" data-view="office">辦公室</button>
        <button role="tab" id="tab-tree" aria-selected="false" data-view="tree">派工樹</button>
        <button role="tab" id="tab-log" aria-selected="false" data-view="log">紀錄</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="notice" id="notice" hidden></div>

  <section class="view" id="view-office">
    <div class="roundbar">
      <div class="prompt" id="promptBox"><small>這一輪你交代的事</small><p id="promptTxt">還沒有收到任何指令。</p></div>
      <div style="display:grid;gap:6px">
        <select id="roundSel" aria-label="選擇第幾輪"></select>
        <label class="toggle"><input type="checkbox" id="onlyActive"> 只看這輪有動的人</label>
      </div>
    </div>
    <div class="rooms" id="rooms"></div>
  </section>

  <section class="view" id="view-tree" hidden>
    <div class="tree" id="tree"></div>
  </section>

  <section class="view" id="view-log" hidden>
    <div class="logtools">
      <input type="search" id="logSearch" placeholder="搜尋紀錄（人名、檔名、指令…）" aria-label="搜尋紀錄">
      <button class="chip" data-f="all" aria-pressed="true">全部</button>
      <button class="chip" data-f="dispatch" aria-pressed="false">派工</button>
      <button class="chip" data-f="tool" aria-pressed="false">動作</button>
      <button class="chip" data-f="think" aria-pressed="false">思考</button>
      <button class="chip" data-f="report" aria-pressed="false">回報</button>
      <button class="chip" data-f="error" aria-pressed="false">錯誤</button>
    </div>
    <div class="log" id="log"></div>
  </section>
</main>

<div id="sheetRoot"></div>

<script>/*__OFFICE_CONFIG__*/</script>
<script>
(function () {
  "use strict";
  const ROSTER = window.OFFICE_ROSTER || { depts: {}, roles: [] };
  const DEMO = !!window.OFFICE_DEMO || /[?&]demo=1/.test(location.search);
  const ROLE = {};
  ROSTER.roles.forEach(r => { ROLE[r.slug] = r; });
  const DEPT_ORDER = ["exec", "product", "design", "eng", "ai", "platform", "qa", "content"];
  const CONTRACT = { name: "外包", color: "#9db0b8" };

  // ---------- 小工具 ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const short = (s, n) => { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n) + "…" : s; };
  const base = p => String(p || "").split("/").pop();
  const host = u => { try { return new URL(u).host; } catch (e) { return short(u, 30); } };
  const hhmmss = ts => { const d = new Date(ts || Date.now()); return d.toTimeString().slice(0, 8); };
  const roleOf = type => (type && ROLE[type]) ? ROLE[type] : null;
  const roleName = type => roleOf(type) ? roleOf(type).zh : (type ? "外包：" + type : "老闆");
  const deptOf = r => r ? (ROSTER.depts[r.dept] || CONTRACT) : CONTRACT;
  const colorOfType = type => type === "boss" ? ROSTER.depts.exec.color : deptOf(roleOf(type)).color;

  // ---------- 像素小人 ----------
  function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  const HAIRS = ["#3a2a22", "#1b1b1b", "#6b4423", "#b9905a", "#8e3b2f", "#4a4a5a"];
  const SKINS = ["#f2c9a0", "#e0ac80", "#c68a5e", "#f5d5b5"];
  const spriteCache = {};
  function sprite(type, size) {
    const key = type + "|" + size;
    if (spriteCache[key]) return spriteCache[key];
    const r = type === "boss" ? { kind: "boss" } : (roleOf(type) || { kind: "contract" });
    const body = colorOfType(type);
    const h = hash(type || "x");
    const C = { h: HAIRS[h % HAIRS.length], s: SKINS[(h >>> 4) % SKINS.length], e: "#1b1b1b", m: "#b5523b", d: "#2c3a46", g: "#e9efe6", b: body, a: "#c0392b", y: "#ffd34d", w: "#ffffff" };
    const style = (h >>> 8) % 3;
    let top = [["....hhhh....", "...hhhhhh..."], ["...hhhhhh...", "..hhhhhhhh.."], ["..h.h.h.h...", "...hhhhhh..."]][style];
    if (r.kind === "boss") top = ["..y.y..y.y..", "..yyyyyyyy.."];
    if (r.kind === "researcher") top = ["...wwwww....", "..wwwwwwww.."];
    const eyes = r.kind === "checker" ? "..ggeggegg.." : "...sesses...";
    let chest = ["..bbbbbbbb..", ".bbbbbbbbbb.", ".sbbbbbbbbs."];
    if (r.kind === "boss" || r.kind === "coordinator") chest = ["..bbbaabbb..", ".bbbbaabbbb.", ".sbbbaabbbs."];
    if (r.kind === "lead") chest = ["..bbbbbbbb..", ".bbbbbbyybb.", ".sbbbbbbbbs."];
    if (r.kind === "contract") chest = ["..dddddddd..", ".dddddddddd.", ".sddddddddds."].map(x => x.slice(0, 12));
    const rows = [top[0], top[1], "...ssssss...", eyes, "...ssssss...", "....smms....", ...chest, "..bbbbbbbb..", "...dd..dd...", "...dd..dd...", "...dd..dd..."];
    let rects = "";
    rows.forEach((row, y) => { for (let x = 0; x < 12; x++) { const c = row[x]; if (c && c !== ".") rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${C[c]}"/>`; } });
    return (spriteCache[key] = `<svg class="sprite" viewBox="0 0 12 15" width="${size}" height="${Math.round(size * 15 / 12)}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`);
  }

  // ---------- 把一個動作翻成中文 ----------
  function describeTool(e) {
    const t = e.tool_name || "", i = e.tool_input || {};
    switch (t) {
      case "Bash": return "執行指令：" + short(i.command, 70);
      case "Read": return "讀檔：" + base(i.file_path);
      case "Write": return "寫檔：" + base(i.file_path);
      case "Edit": case "MultiEdit": return "修改：" + base(i.file_path);
      case "NotebookEdit": return "改筆記本：" + base(i.notebook_path);
      case "WebSearch": return "上網搜尋：" + short(i.query, 40);
      case "WebFetch": return "讀網頁：" + host(i.url);
      case "Agent": case "Task": return "派工給 " + roleName(i.subagent_type || "general-purpose") + "：" + short(i.description, 40);
      case "AskUserQuestion": return "用按鈕問你問題";
      case "TaskCreate": case "TaskUpdate": case "TodoWrite": return "更新待辦清單";
      case "Glob": case "Grep": return "找檔案：" + short(i.pattern, 30);
      case "Skill": return "使用技能：" + short(i.skill || i.name, 30);
      default: return t.startsWith("mcp__") ? "使用工具：" + t.split("__").slice(-1)[0] : (t || "動作");
    }
  }

  // ---------- 事件 → 狀態 ----------
  let EVENTS = [];
  let S = null;
  function newState() { return { rounds: [], inst: {}, pending: [], counters: { dispatch: 0, tools: 0, errors: 0 } }; }
  function curRound() {
    if (!S.rounds.length) S.rounds.push({ idx: 1, prompt: "", start: Date.now(), end: null, keys: new Set(["main"]) });
    return S.rounds[S.rounds.length - 1];
  }
  function inst(key, type) {
    let x = S.inst[key];
    if (!x) {
      x = S.inst[key] = { key, type: type || (key === "main" ? "boss" : "unknown"), status: "idle", action: "", parent: null, task: "", prompt: "", report: "", thoughts: [], timeline: [], errors: 0, round: S.rounds.length || 1, start: null, end: null };
    } else if (type && (x.type === "unknown")) x.type = type;
    curRound().keys.add(key);
    return x;
  }
  function keyOf(e) { return e.agent_id || "main"; }
  function push(x, ts, cls, text) { x.timeline.push({ ts, cls, text }); if (x.timeline.length > 400) x.timeline.shift(); }

  function apply(e) {
    const ev = e.hook_event_name, ts = e.ts || Date.now();
    e._cat = "other";
    if (ev === "UserPromptSubmit" && !e.agent_id) {
      S.rounds.push({ idx: S.rounds.length + 1, prompt: e.prompt || "", start: ts, end: null, keys: new Set(["main"]) });
      const b = inst("main", "boss"); b.status = "working"; b.action = "看你交代的事"; b.report = ""; b.round = S.rounds.length; b.start = ts;
      push(b, ts, "", "收到：" + short(e.prompt, 80));
      e._who = "boss"; e._what = "你交代：" + short(e.prompt, 120); e._cat = "dispatch"; return;
    }
    if (ev === "PreToolUse") {
      const x = inst(keyOf(e), e.agent_type); x.status = "working"; x.action = describeTool(e); if (!x.start) x.start = ts;
      push(x, ts, "", x.action); S.counters.tools++;
      e._who = x.type; e._what = x.action; e._cat = "tool";
      if (e.tool_name === "Agent" || e.tool_name === "Task") {
        const i = e.tool_input || {};
        S.pending.push({ parent: x.key, type: i.subagent_type || "general-purpose", desc: i.description || "", prompt: i.prompt || "", used: false });
        S.counters.dispatch++; e._cat = "dispatch";
      }
      if (e.tool_name === "AskUserQuestion") { x.status = "waiting"; }
      return;
    }
    if (ev === "SubagentStart") {
      const x = inst(e.agent_id || ("anon-" + ts), e.agent_type); x.status = "working"; x.start = ts; x.round = S.rounds.length || 1;
      const p = S.pending.find(p => !p.used && p.type === e.agent_type) || S.pending.find(p => !p.used);
      if (p) { p.used = true; x.parent = p.parent; x.task = p.desc; x.prompt = p.prompt; }
      x.action = x.task ? "接到任務：" + short(x.task, 40) : "上工";
      push(x, ts, "", "上工" + (x.task ? "：" + x.task : ""));
      e._who = x.type; e._what = "上工" + (x.parent ? "（" + roleName(S.inst[x.parent] && S.inst[x.parent].type) + " 指派）" : "") + (x.task ? "：" + short(x.task, 60) : ""); e._cat = "dispatch";
      return;
    }
    if (ev === "PostToolUse") {
      const x = inst(keyOf(e), e.agent_type); if (x.status === "waiting") x.status = "working";
      e._who = x.type; e._what = "完成：" + describeTool(e); e._cat = "tool"; return;
    }
    if (ev === "PostToolUseFailure") {
      const x = inst(keyOf(e), e.agent_type); x.errors++; S.counters.errors++;
      const msg = typeof e.error === "string" ? e.error : JSON.stringify(e.error || e.tool_response || "");
      push(x, ts, "er", "失敗：" + describeTool(e) + "｜" + short(msg, 80));
      e._who = x.type; e._what = "失敗：" + describeTool(e); e._cat = "error"; return;
    }
    if (ev === "SubagentStop") {
      const x = inst(e.agent_id || "main", e.agent_type); x.status = "done"; x.end = ts; x.action = "交回成果";
      x.report = e.last_assistant_message || x.report;
      push(x, ts, "", "交回成果");
      e._who = x.type; e._what = "交回成果：" + short(x.report, 100); e._cat = "report"; return;
    }
    if (ev === "Thinking") {
      let k = e.agent_id || "main";
      if (!S.inst[k]) { const m = Object.keys(S.inst).find(z => z.indexOf(k) >= 0 || k.indexOf(z) >= 0); if (m) k = m; }
      const x = inst(k, null); x.thoughts.push({ ts, text: e.text || "" });
      push(x, ts, "th", "思考：" + short(e.text, 90));
      e._who = x.type; e._what = "思考：" + short(e.text, 120); e._cat = "think"; return;
    }
    if (ev === "Stop") {
      const b = inst("main", "boss"); b.status = "done"; b.action = "交付給你"; b.report = e.last_assistant_message || ""; b.end = ts;
      curRound().end = ts; push(b, ts, "", "交付");
      e._who = "boss"; e._what = "交付：" + short(b.report, 100); e._cat = "report"; return;
    }
    if (ev === "StopFailure") {
      const b = inst("main", "boss"); b.status = "error"; b.errors++; S.counters.errors++; curRound().end = ts;
      e._who = "boss"; e._what = "這輪因錯誤中斷"; e._cat = "error"; return;
    }
    if (ev === "Notification") {
      const x = inst(keyOf(e), e.agent_type); if (/permission|權限|waiting|等待/i.test(e.message || "")) x.status = "waiting";
      e._who = x.type; e._what = "通知：" + short(e.message, 100); return;
    }
    const names = { SessionStart: "開始對話", SessionEnd: "對話結束", PreCompact: "整理對話（壓縮）", TaskCreated: "新增待辦：" + short(e.task_subject, 40), TaskCompleted: "完成待辦：" + short(e.task_subject, 40) };
    e._who = e.agent_type || "boss"; e._what = names[ev] || ev || "事件";
  }

  function rebuild() { S = newState(); EVENTS.forEach(apply); }

  // ---------- 畫面 ----------
  let selRound = null; // null = 最新
  let view = "office";
  let logFilter = "all";
  let openKey = null;

  function roundShown() { return selRound == null ? S.rounds[S.rounds.length - 1] : S.rounds[selRound - 1]; }

  function statusOfType(type, round) {
    const keys = [...(round ? round.keys : [])].filter(k => S.inst[k] && S.inst[k].type === type);
    const xs = keys.map(k => S.inst[k]);
    if (!xs.length) return { st: "idle", xs };
    const pri = ["error", "waiting", "working", "done"];
    let st = "done";
    for (const p of pri) if (xs.some(x => x.status === p)) { st = p; break; }
    return { st, xs };
  }

  function renderStats() {
    const r = roundShown();
    const dur = r ? Math.max(0, Math.round(((r.end || (isLive() ? Date.now() : (lastTs() || Date.now()))) - r.start) / 1000)) : 0;
    const keys = r ? [...r.keys].filter(k => k !== "main") : [];
    $("#stats").innerHTML =
      `<span class="stat">這輪出動<b>${keys.length}</b>人</span>` +
      `<span class="stat">派工<b>${S.counters.dispatch}</b></span>` +
      `<span class="stat">動作<b>${S.counters.tools}</b></span>` +
      `<span class="stat ${S.counters.errors ? "bad" : ""}">錯誤<b>${S.counters.errors}</b></span>` +
      `<span class="stat">耗時<b>${dur >= 60 ? Math.floor(dur / 60) + "分" + (dur % 60) + "秒" : dur + "秒"}</b></span>`;
  }
  function lastTs() { return EVENTS.length ? EVENTS[EVENTS.length - 1].ts : 0; }

  function tileHTML(type, round) {
    const { st, xs } = statusOfType(type, round);
    const r = type === "boss" ? ROLE.boss : roleOf(type);
    const name = r ? r.zh : roleName(type);
    const live = xs.filter(x => x.status === "working" || x.status === "waiting");
    const act = (live[0] || xs[xs.length - 1] || {}).action || "";
    let badge = "";
    if (xs.length > 1) badge = `<span class="badge n">×${xs.length}</span>`;
    else if (st === "done") badge = `<span class="badge">✓</span>`;
    if (st === "error") badge = `<span class="badge err">!</span>`;
    if (st === "waiting") badge = `<span class="badge wait">?</span>`;
    return `<button class="tile ${st}" style="--c:${colorOfType(type)}" data-type="${esc(type)}" aria-label="${esc(name)}：${esc({ idle: "閒置", working: "工作中", waiting: "等待中", done: "完成", error: "出錯" }[st])}">${badge}${sprite(type, 36)}<span class="nm">${esc(name)}</span><span class="act">${esc(act)}</span></button>`;
  }

  function renderOffice() {
    const r = roundShown();
    $("#promptTxt").textContent = r && r.prompt ? r.prompt : "還沒有收到任何指令。";
    const rs = $("#roundSel");
    rs.innerHTML = S.rounds.map(x => `<option value="${x.idx}">第 ${x.idx} 輪：${esc(short(x.prompt, 24) || "（無內容）")}</option>`).reverse().join("") || `<option>尚無</option>`;
    rs.value = r ? String(r.idx) : "";
    const only = $("#onlyActive").checked;
    const usedTypes = new Set([...(r ? r.keys : [])].map(k => S.inst[k] && S.inst[k].type).filter(Boolean));
    let html = "";
    for (const d of DEPT_ORDER) {
      const dep = ROSTER.depts[d]; if (!dep) continue;
      let members = ROSTER.roles.filter(x => x.dept === d);
      if (only) members = members.filter(m => usedTypes.has(m.slug));
      if (!members.length) continue;
      const working = members.filter(m => ["working", "waiting"].includes(statusOfType(m.slug, r).st)).length;
      const groups = {};
      members.forEach(m => { const g = m.team || ""; (groups[g] = groups[g] || []).push(m); });
      let inner = "";
      Object.keys(groups).sort((a, b) => (a === "" ? -1 : b === "" ? 1 : 0)).forEach(g => {
        if (g) inner += `<div class="team-label">${esc(g)}</div>`;
        inner += `<div class="tiles">${groups[g].map(m => tileHTML(m.slug, r)).join("")}</div>`;
      });
      html += `<section class="room ${d === "exec" ? "exec" : ""}" style="--c:${dep.color}"><div class="room-head"><h2>${esc(dep.name)}</h2><span>${working ? working + " 人工作中" : members.length + " 人"}</span></div>${inner}</section>`;
    }
    const contractors = [...usedTypes].filter(t => t !== "boss" && !ROLE[t]);
    if (contractors.length) {
      html += `<section class="room" style="--c:${CONTRACT.color}"><div class="room-head"><h2>外包</h2><span>不在組織表裡的 agent</span></div><div class="tiles">${contractors.map(t => tileHTML(t, r)).join("")}</div></section>`;
    }
    $("#rooms").innerHTML = html;
  }

  function renderTree() {
    const r = roundShown();
    if (!r) { $("#tree").innerHTML = `<p class="notice">這一輪還沒有派工。</p>`; return; }
    const keys = [...r.keys].filter(k => S.inst[k]);
    const kids = {};
    keys.forEach(k => { const p = S.inst[k].parent || (k === "main" ? null : "main"); if (p) (kids[p] = kids[p] || []).push(k); });
    const label = { idle: "閒置", working: "工作中", waiting: "等你回覆", done: "完成", error: "出錯" };
    function node(k, depth) {
      const x = S.inst[k]; if (!x || depth > 8) return "";
      const ch = (kids[k] || []).sort((a, b) => (S.inst[a].start || 0) - (S.inst[b].start || 0));
      return `<li><button class="node" style="--c:${colorOfType(x.type)}" data-key="${esc(k)}">${sprite(x.type, 22)}<span class="t"><b>${esc(roleName(x.type))} <span class="st ${x.status}">${label[x.status] || x.status}</span></b><span>${esc(short(x.task || x.action, 60))}</span></span></button>${ch.length ? `<ul>${ch.map(c => node(c, depth + 1)).join("")}</ul>` : ""}</li>`;
    }
    $("#tree").innerHTML = `<ul>${node("main", 0)}</ul>`;
  }

  function renderLog() {
    const q = $("#logSearch").value.trim().toLowerCase();
    const rows = [];
    for (let i = EVENTS.length - 1; i >= 0 && rows.length < 400; i--) {
      const e = EVENTS[i];
      if (logFilter !== "all" && e._cat !== logFilter) continue;
      const who = e._who === "boss" ? "老闆" : roleName(e._who);
      const hay = (who + " " + (e._what || "") + " " + JSON.stringify(e.tool_input || "")).toLowerCase();
      if (q && hay.indexOf(q) < 0) continue;
      const detail = Object.assign({}, e); Object.keys(detail).forEach(k => { if (k[0] === "_") delete detail[k]; });
      rows.push(`<details class="ev ${e._cat === "error" ? "err" : ""}" style="--c:${colorOfType(e._who || "boss")}"><summary><time>${hhmmss(e.ts)}</time>${sprite(e._who || "boss", 20)}<span class="what"><b>${esc(who)}</b>${esc(e._what || e.hook_event_name)}</span></summary><pre>${esc(JSON.stringify(detail, null, 2))}</pre></details>`);
    }
    $("#log").innerHTML = rows.join("") || `<p class="notice">沒有符合的紀錄。</p>`;
  }

  function openSheet(type, key) {
    openKey = { type, key };
    const r = roundShown();
    let xs;
    if (key) xs = [S.inst[key]].filter(Boolean);
    else xs = statusOfType(type, r).xs;
    if (!type && xs[0]) type = xs[0].type;
    const role = type === "boss" ? ROLE.boss : roleOf(type);
    const dep = type === "boss" ? ROSTER.depts.exec : deptOf(role);
    const label = { idle: "閒置", working: "工作中", waiting: "等你回覆", done: "完成", error: "出錯" };
    let body = `<div class="box"><h4>職責</h4><p>${esc(role ? role.job : "不在組織表裡的 agent（例如內建的 Explore、general-purpose）。")}</p></div>`;
    if (!xs.length) body += `<div class="box"><p>這一輪沒有出動。</p></div>`;
    xs.forEach((x, n) => {
      const parent = x.parent ? roleName(S.inst[x.parent] && S.inst[x.parent].type) : (x.key === "main" ? "" : "老闆");
      body += `<div class="inst">${xs.length > 1 ? `<b>第 ${n + 1} 位</b>` : ""}
        <div class="box"><h4>狀態</h4><p><span class="st ${x.status}">${label[x.status] || x.status}</span>${parent ? "　由 " + esc(parent) + " 指派" : ""}${x.errors ? "　錯誤 " + x.errors + " 次" : ""}</p></div>
        ${x.task || x.prompt ? `<div class="box"><h4>接到的任務</h4><p>${esc(x.task)}${x.prompt ? "\n\n" + esc(short(x.prompt, 1200)) : ""}</p></div>` : ""}
        ${x.thoughts.length ? `<div class="box"><h4>思考摘要（${x.thoughts.length}）</h4><p>${esc(x.thoughts.slice(-3).map(t => t.text).join("\n\n"))}</p></div>` : ""}
        <div class="box"><h4>動作紀錄</h4><div class="timeline">${x.timeline.slice(-80).map(t => `<div><time>${hhmmss(t.ts)}</time><span class="${t.cls}">${esc(t.text)}</span></div>`).join("") || "尚無"}</div></div>
        ${x.report ? `<div class="box"><h4>${x.key === "main" ? "交付給你的內容" : "交回的成果"}</h4><p>${esc(short(x.report, 4000))}</p></div>` : ""}
      </div>`;
    });
    $("#sheetRoot").innerHTML = `<div class="scrim" data-close="1"></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(roleName(type))}" style="--c:${dep.color}">
      <div class="sheet-head">${sprite(type, 44)}<div><h3>${esc(type === "boss" ? "老闆" : roleName(type))}</h3><small>${esc(dep.name)}${role && role.team ? "・" + esc(role.team) : ""}</small></div><button class="close" data-close="1">關閉</button></div>${body}</aside>`;
  }
  function closeSheet() { openKey = null; $("#sheetRoot").innerHTML = ""; }

  function render() {
    renderStats();
    if (view === "office") renderOffice();
    if (view === "tree") renderTree();
    if (view === "log") renderLog();
    if (openKey) {
      const sc = document.querySelector(".sheet"); const top = sc ? sc.scrollTop : 0;
      openSheet(openKey.type, openKey.key);
      const sc2 = document.querySelector(".sheet"); if (sc2) sc2.scrollTop = top;
    }
  }

  // ---------- 互動 ----------
  document.addEventListener("click", ev => {
    const t = ev.target.closest("[data-view],.tile,.node,.chip,[data-close]");
    if (!t) return;
    if (t.dataset.close) return closeSheet();
    if (t.dataset.view) {
      view = t.dataset.view;
      document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b === t)));
      ["office", "tree", "log"].forEach(v => { $("#view-" + v).hidden = v !== view; });
      return render();
    }
    if (t.classList.contains("tile")) return openSheet(t.dataset.type, null);
    if (t.classList.contains("node")) return openSheet(null, t.dataset.key);
    if (t.classList.contains("chip")) {
      logFilter = t.dataset.f;
      document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === t)));
      return renderLog();
    }
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
  $("#roundSel").addEventListener("change", e => { const v = Number(e.target.value); selRound = (v === S.rounds.length) ? null : v; render(); });
  $("#onlyActive").addEventListener("change", render);
  $("#logSearch").addEventListener("input", renderLog);

  // ---------- 資料來源 ----------
  let SESSIONS = [], SESSION = null, SINCE = 0, liveOn = false;
  function isLive() { return liveOn; }
  function setLive(on, txt) { liveOn = on; $("#live").classList.toggle("on", on); $("#liveTxt").textContent = txt; }
  function notice(html) { const n = $("#notice"); n.hidden = !html; n.innerHTML = html || ""; }

  async function api(path) {
    const res = await fetch(path, { credentials: "same-origin", cache: "no-store" });
    if (res.status === 401) { location.href = "/"; throw new Error("unauthorized"); }
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }
  function fillSessions() {
    $("#sessionSel").innerHTML = SESSIONS.map(s => `<option value="${esc(s.session)}">${esc(new Date(s.last_ts).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }))}　${esc(short(s.title || "（還沒有指令）", 30))}</option>`).join("");
    if (SESSION) $("#sessionSel").value = SESSION;
  }
  async function loadSessions() {
    SESSIONS = await api("/api/sessions");
    if (!SESSION && SESSIONS.length) SESSION = SESSIONS[0].session;
    fillSessions();
    if (!SESSIONS.length) notice("<b>還沒有收到任何事件。</b>在 Claude App 的 Code 開一個 ai-office 的雲端對話、交代一件事，這裡就會開始動。");
    else notice("");
  }
  async function poll() {
    if (!SESSION) return;
    const batch = await api(`/api/events?session=${encodeURIComponent(SESSION)}&since=${SINCE}`);
    if (batch.length) {
      batch.forEach(e => { EVENTS.push(e); SINCE = Math.max(SINCE, e.id || 0); apply(e); });
      render();
    } else renderStats();
    const s = SESSIONS.find(x => x.session === SESSION);
    const recent = Date.now() - lastTs() < 120000;
    setLive(recent && !(s && s.ended), recent ? "即時" : "已停止");
  }
  $("#sessionSel").addEventListener("change", e => { SESSION = e.target.value; SINCE = 0; EVENTS = []; selRound = null; rebuild(); render(); poll().catch(() => {}); });

  async function startLive() {
    rebuild(); render();
    try { await loadSessions(); await poll(); } catch (e) { setLive(false, "連不上後台"); notice("<b>連不上監控後台。</b>" + esc(e.message)); }
    setInterval(() => { if (!document.hidden) poll().catch(() => setLive(false, "連線中斷")); }, 1500);
    setInterval(() => { if (!document.hidden) loadSessions().catch(() => {}); }, 15000);
  }

  function startDemo() {
    setLive(true, "示範中");
    notice("<b>示範模式</b>：這是模擬的一輪工作，讓你先看畫面長怎樣。接上後台之後就會顯示真的紀錄。");
    $("#sessionSel").innerHTML = `<option>示範：庫存預測功能</option>`;
    const script = demoScript();
    const t0 = script[0].ts;
    let i = 0;
    const speed = 1.6;
    // 一打開就先放一半，讓畫面不是空的
    const warm = Math.floor(script.length * 0.55);
    for (; i < warm; i++) { const e = Object.assign({}, script[i]); EVENTS.push(e); }
    rebuild(); render();
    function tick() {
      if (i >= script.length) {
        setLive(false, "示範結束，6 秒後重播");
        setTimeout(() => { EVENTS = []; i = 0; rebuild(); setLive(true, "示範中"); tick(); }, 6000);
        return;
      }
      const e = Object.assign({}, script[i]); const prev = i ? script[i - 1].ts : t0;
      EVENTS.push(e); apply(e); render(); i++;
      setTimeout(tick, Math.min(1400, Math.max(120, (script[i] ? script[i].ts - e.ts : 300) / speed)));
    }
    setTimeout(tick, 600);
  }

  if (DEMO) startDemo(); else startLive();
})();
